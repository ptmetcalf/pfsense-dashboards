name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  appinspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create app archive
        run: |
          APP_NAME="pfsense-dashboards"
          TAR_NAME="${APP_NAME}.tgz"
          TAR_PATH="${RUNNER_TEMP}/${TAR_NAME}"
          tar \
            --exclude="pfsense-dashboards/.git" \
            --exclude="pfsense-dashboards/.github" \
            --exclude="pfsense-dashboards/.gitignore" \
            --exclude="pfsense-dashboards/.release-please-config.json" \
            --exclude="pfsense-dashboards/.release-please-manifest.json" \
            --exclude="pfsense-dashboards/.claude" \
            --exclude="pfsense-dashboards/.DS_Store" \
            --exclude="pfsense-dashboards/.venv-appinspect" \
            --exclude="pfsense-dashboards/dist" \
            -czf "${TAR_PATH}" -C .. pfsense-dashboards
          echo "TAR_PATH=${TAR_PATH}" >> "$GITHUB_ENV"
          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install splunk-appinspect splunk-packaging-toolkit

      - name: Run AppInspect
        run: |
          splunk-appinspect inspect "${TAR_PATH}" \
            --mode precert \
            --data-format json \
            --output-file "${APP_NAME}-appinspect.json" \
            --ci || {
              code=$?
              if [ "$code" -eq 103 ]; then
                echo "AppInspect warnings detected (exit 103); allowing CI to continue."
                exit 0
              fi
              exit "$code"
            }

      - name: Run slim validate
        run: |
          slim validate "${TAR_PATH}"
