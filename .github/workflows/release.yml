name: release

on:
  workflow_run:
    workflows:
      - "release-please"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: true
    env:
      APP_NAME: pfsense-dashboards
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          git fetch --tags --force
          TAG_NAME="$(git tag --points-at "${GITHUB_SHA}" | sort -V | tail -n1)"
          if [ -z "${TAG_NAME}" ]; then
            echo "No tag found for ${GITHUB_SHA}; skipping release packaging."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create app archive
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          TAR_NAME="${APP_NAME}-${{ steps.tag.outputs.tag }}.tgz"
          TAR_PATH="${RUNNER_TEMP}/${TAR_NAME}"
          tar \
            --exclude="pfsense-dashboards/.git" \
            --exclude="pfsense-dashboards/.github" \
            --exclude="pfsense-dashboards/.gitignore" \
            --exclude="pfsense-dashboards/.release-please-config.json" \
            --exclude="pfsense-dashboards/.release-please-manifest.json" \
            --exclude="pfsense-dashboards/.claude" \
            --exclude="pfsense-dashboards/.DS_Store" \
            --exclude="pfsense-dashboards/.venv-appinspect" \
            --exclude="pfsense-dashboards/dist" \
            -czf "${TAR_PATH}" -C .. pfsense-dashboards
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          echo "TAR_PATH=${TAR_PATH}" >> "$GITHUB_ENV"

      - name: Set up Python
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AppInspect
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install splunk-appinspect

      - name: Run AppInspect
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          splunk-appinspect inspect "${TAR_PATH}" \
            --mode precert \
            --data-format json \
            --output-file "${APP_NAME}-appinspect.json" \
            --ci

      - name: Upload AppInspect report
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-appinspect
          path: ${{ env.APP_NAME }}-appinspect.json

      - name: Upload release asset
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" "${TAR_PATH}" --clobber
