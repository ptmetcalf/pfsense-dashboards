[pfSense - Known IP Block Destinations (Prev 7d, Exclude Last 24h)]
search = `pfsense_index` sourcetype=pfsense:iplog | eval dest_ip_norm=coalesce(dst_ip, dest_ip, dest) | where isnotnull(dest_ip_norm) AND dest_ip_norm!="" | stats max(_time) as last_seen by dest_ip_norm | eval last_seen=strftime(last_seen,"%F %T") | fields dest_ip_norm last_seen | outputlookup pfsense_known_iplog_dests_prev7d.csv
cron_schedule = 0 * * * *
dispatch.earliest_time = -8d@d
dispatch.latest_time = -1d@d
enableSched = 1
