search = `pfsense_index` sourcetype=pfsense:filterlog | eval src_ip_norm=coalesce(src_ip,src) | stats max(_time) as last_seen by src_ip_norm | eval last_seen=strftime(last_seen,"%F %T") | fields src_ip_norm last_seen | outputlookup pfsense_known_sources_prev7d.csv
cron_schedule = 0 * * * *
dispatch.earliest_time = -8d@d
