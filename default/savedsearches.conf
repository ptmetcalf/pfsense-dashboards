[pfSense - Baseline Block Rate (7d)]
search = `pfsense_index` sourcetype=pfsense:filterlog | eval action_norm=lower(coalesce(action,vendor_action)) | stats count(eval(action_norm="blocked")) as blocked count as total | eval baseline_pct=if(total>0, round(blocked/total*100,2), 0) | eval updated_time=strftime(now(),"%F %T") | fields baseline_pct updated_time | outputlookup pfsense_baseline_block_rate.csv
cron_schedule = 0 * * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
enableSched = 1

[pfSense - Baseline Unique Sources Per Hour (7d)]
search = `pfsense_index` sourcetype=pfsense:filterlog | eval src_ip_norm=coalesce(src_ip,src) | timechart span=1h dc(src_ip_norm) as hourly_unique | stats avg(hourly_unique) as baseline_per_hour | eval baseline_per_hour=round(baseline_per_hour,2) | eval updated_time=strftime(now(),"%F %T") | fields baseline_per_hour updated_time | outputlookup pfsense_baseline_unique_sources_hourly.csv
cron_schedule = 0 * * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
enableSched = 1

[pfSense - Known Sources (7d)]
search = `pfsense_index` sourcetype=pfsense:filterlog | eval src_ip_norm=coalesce(src_ip,src) | stats max(_time) as last_seen by src_ip_norm | eval last_seen=strftime(last_seen,"%F %T") | fields src_ip_norm last_seen | outputlookup pfsense_known_sources_7d.csv
cron_schedule = 0 * * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
enableSched = 1

