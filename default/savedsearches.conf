search = `pfsense_index` sourcetype=pfsense:dnsbl | stats max(_time) as last_seen by blocked_domain | eval last_seen=strftime(last_seen,"%F %T") | fields blocked_domain last_seen | outputlookup pfsense_known_dnsbl_domains_prev7d.csv
cron_schedule = 0 * * * *
