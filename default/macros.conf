# Macro definitions for pfSense Dashboards

[pfsense_index]
definition = index=pfsense
iseval = 0

[pfsense_normalize]
definition = eval transport_norm=lower(coalesce(transport,vendor_transport))
iseval = 0

[pfsense_base_filter]
definition = sourcetype=pfsense:* OR sourcetype=pfsense:filterlog OR sourcetype=pfsense:dnsbl OR sourcetype=pfsense:iplog
iseval = 0

[pfsense_token_filter]
definition = action=$action$ vendor_direction=$direction$ transport_norm=$transport$
iseval = 0

[pfsense_ip_labels]
definition = eval src_ip_type=case(match(src_ip_norm, ":") AND cidrmatch("fe80::/10", src_ip_norm), "v6 link-local", match(src_ip_norm, ":") AND cidrmatch("fc00::/7", src_ip_norm), "v6 ula", match(src_ip_norm, ":") AND cidrmatch("::1/128", src_ip_norm), "v6 loopback", match(src_ip_norm, ":") AND cidrmatch("ff00::/8", src_ip_norm), "v6 multicast", match(src_ip_norm, ":") AND cidrmatch("2000::/3", src_ip_norm), "v6 global", match(src_ip_norm, ":"), "v6 other"), dest_ip_type=case(match(dest_ip_norm, ":") AND cidrmatch("fe80::/10", dest_ip_norm), "v6 link-local", match(dest_ip_norm, ":") AND cidrmatch("fc00::/7", dest_ip_norm), "v6 ula", match(dest_ip_norm, ":") AND cidrmatch("::1/128", dest_ip_norm), "v6 loopback", match(dest_ip_norm, ":") AND cidrmatch("ff00::/8", dest_ip_norm), "v6 multicast", match(dest_ip_norm, ":") AND cidrmatch("2000::/3", dest_ip_norm), "v6 global", match(dest_ip_norm, ":"), "v6 other") | eval src_display=if(isnotnull(src_ip_type), src_display." (".src_ip_type.")", src_display), dest_display=if(isnotnull(dest_ip_type), dest_display." (".dest_ip_type.")", dest_display) | lookup pfsense_zone_subnets cidr as src_ip_norm OUTPUT zone as src_zone | lookup pfsense_zone_subnets cidr as dest_ip_norm OUTPUT zone as dest_zone | lookup pfsense_interface_ips ip as src_ip_norm OUTPUT interface as src_interface | lookup pfsense_interface_ips ip as dest_ip_norm OUTPUT interface as dest_interface | lookup pfsense_gateway_ips ip as src_ip_norm OUTPUT name as src_gateway | lookup pfsense_gateway_ips ip as dest_ip_norm OUTPUT name as dest_gateway | eval src_tags=mvappend(src_zone, src_interface, src_gateway), dest_tags=mvappend(dest_zone, dest_interface, dest_gateway) | eval src_tags=mvfilter(isnotnull(src_tags)), dest_tags=mvfilter(isnotnull(dest_tags)) | eval src_display=if(mvcount(src_tags)>0, src_display." [".mvjoin(src_tags, ", ")."]", src_display), dest_display=if(mvcount(dest_tags)>0, dest_display." [".mvjoin(dest_tags, ", ")."]", dest_display)
iseval = 0

[pfsense_ipv6_filter]
definition = eval show_ipv6=if("$show_ipv6$"="1", 1, 0) | where show_ipv6=1 OR (NOT match(src_ip_norm, ":") AND NOT match(dest_ip_norm, ":"))
iseval = 0

[pfsense_port_labels]
definition = lookup pfsense_alias_ports port as dest_port_norm OUTPUT aliases as dest_port_aliases | eval dest_port_label=if(isnotnull(dest_port_aliases), dest_port_norm." [".dest_port_aliases."]", dest_port_norm)
iseval = 0
